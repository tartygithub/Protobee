<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appTitle} + ' - User Management'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800">

<!-- Header Navbar -->
<nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide" th:text="${appTitle}"></h1>
            <p class="text-xs text-indigo-200">System Code: <span th:text="${appDocumentCode}"></span> | Ver: <span th:text="${appVersion}"></span></p>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/" class="hover:underline text-sm font-semibold">Dashboard</a>
            <a href="/swagger-ui/index.html" target="_blank" class="hover:underline text-sm font-semibold">Swagger API</a>
            <span class="text-indigo-200">|</span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-semibold">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-7xl mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-2xl font-bold text-indigo-700 mb-4 border-b pb-2">User Maintenance & Directory</h2>

        <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 text-sm" role="alert">
            <span th:text="${success}"></span>
        </div>

        <!-- Password Reset modal trigger (handled dynamically or via simplified form) -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Failed Attempts</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pwd Expiry</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200 text-sm">
                <tr th:each="user : ${users}">
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900" th:text="${user.id}"></td>
                    <td class="px-6 py-4 whitespace-nowrap font-semibold text-indigo-600" th:text="${user.username}"></td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${user.locked}" class="px-2 py-1 text-xs font-bold bg-red-100 text-red-800 rounded-full">Locked</span>
                        <span th:unless="${user.locked}" class="px-2 py-1 text-xs font-bold bg-green-100 text-green-800 rounded-full">Active</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap" th:text="${user.failedLoginAttempts}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-xs text-gray-500" th:text="${user.passwordExpirationDate}"></td>
                    <td class="px-6 py-4 whitespace-nowrap space-x-2">
                        <!-- Lock/Unlock toggle -->
                        <form th:if="${user.locked}" th:action="@{/users/unlock/{id}(id=${user.id})}" method="post" class="inline">
                            <button type="submit" class="bg-green-500 hover:bg-green-600 text-white text-xs px-2 py-1 rounded">Unlock</button>
                        </form>
                        <form th:unless="${user.locked}" th:action="@{/users/lock/{id}(id=${user.id})}" method="post" class="inline">
                            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2 py-1 rounded">Lock</button>
                        </form>

                        <!-- Force Expire Password -->
                        <form th:action="@{/users/expire-password/{id}(id=${user.id})}" method="post" class="inline">
                            <button type="submit" class="bg-purple-500 hover:bg-purple-600 text-white text-xs px-2 py-1 rounded">Expire Pwd</button>
                        </form>

                        <!-- Delete User -->
                        <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" class="inline" onsubmit="return confirm('Delete this user account permanently?')">
                            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Password Reset Card -->
    <div class="bg-white rounded-lg shadow-md p-6 max-w-md">
        <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-1">Reset Password</h3>
        <form th:action="@{/users/reset-password}" method="post" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Select User</label>
                <select name="userId" required class="w-full text-sm px-3 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">New Password</label>
                <input type="password" name="newPassword" required class="w-full text-sm px-3 py-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="New secure password" />
            </div>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded">
                Reset Password
            </button>
        </form>
    </div>
</main>

</body>
</html>
