# ==========================================
# Core Application configurations
# ==========================================
spring.application.name=doc-processor

# Default to H2 In-Memory DB (extremely fast and easy to run/test without installing heavy DBs).
# Easily configurable to Oracle, SQL Server, or PostgreSQL by changing the values below.
spring.datasource.url=jdbc:h2:mem:docdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuration templates for other databases:
# Oracle:
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.datasource.username=system
# spring.datasource.password=oracle
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# SQL Server:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=docdb;encrypt=true;trustServerCertificate=true
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=sa
# spring.datasource.password=SqlSecurePass123
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/docdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom Application Configs (configurable details)
app.info.title=Corporate Doc-Parser Suite
app.info.description=Enterprise Multi-Format Document Management System with configurable DB, LDAP integration, and deep section breakdown.
app.info.version=v3.4.1-Enterprise
app.info.documentCode=DP-2025-SECURE

# Security settings (LDAP switch)
app.auth.ldapEnabled=false
app.auth.ldapUrl=ldap://localhost:389
app.auth.ldapBase=dc=example,dc=com
app.auth.ldapUserDnPattern=uid={0},ou=users

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false
